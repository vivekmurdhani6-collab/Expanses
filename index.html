<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expanses Tracker</title>
  <style>
    /* Option A: Vibrant Animated Gradient (High-Energy & Modern) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #4a00e0, #8e2de2);
      background-size: 400% 400%;
      animation: energeticBg 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    @keyframes energeticBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Modern Glass Container */
    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Summary Section */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .summary-card h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 4px;
    }

    .summary-card p {
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    select option {
      background: #1f1b3a;
      color: #ffffff;
    }

    select:focus, input:focus {
      border-color: #8e2de2;
      box-shadow: 0 0 12px rgba(142, 45, 226, 0.5);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Expanses Tracker</h2>

    <!-- Summary Cards -->
    <div class="summary-grid">
      <div class="summary-card">
        <h4>Income</h4>
        <p>₹0</p>
      </div>
      <div class="summary-card">
        <h4>Expense</h4>
        <p>₹0</p>
      </div>
      <div class="summary-card">
        <h4>Asset</h4>
        <p>₹0</p>
      </div>
      <div class="summary-card">
        <h4>Liability</h4>
        <p>₹0</p>
      </div>
    </div>

    <!-- Entry Form -->
    <form id="tracker-form">
      <div class="form-group">
        <label for="type">Type</label>
        <select id="type" required>
          <option value="" disabled selected>Select Type</option>
          <option value="Income">Income</option>
          <option value="Expense">Expense</option>
          <option value="Asset">Asset</option>
          <option value="Liability">Liability</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="" disabled selected>Select Type First</option>
        </select>
      </div>

      <div class="form-group">
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" placeholder="0" required />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Monthly Salary or Car Loan" />
      </div>

      <button type="submit">Add Entry</button>
    </form>
  </div>

  <!-- Dynamic Category Script -->
  <script>
    const categoryData = {
      Income: ['Salary', 'Investments', 'Freelance', 'Dividends', 'Bonus', 'Other Income'],
      Expense: ['Groceries', 'Rent / Housing', 'Utilities', 'Dining', 'Entertainment', 'Shopping'],
      Asset: ['Bank Savings', 'Stocks & Mutual Funds', 'Real Estate', 'Crypto', 'Gold / Jewelry'],
      Liability: ['Home Loan', 'Car Loan', 'Credit Card', 'Personal Loan', 'Student Loan']
    };

    const typeSelect = document.getElementById('type');
    const categorySelect = document.getElementById('category');

    typeSelect.addEventListener('change', function () {
      const selectedType = this.value;

      // Clear existing options
      categorySelect.innerHTML = '<option value="" disabled selected>Select Category</option>';

      // Populate options for chosen type
      if (categoryData[selectedType]) {
        categoryData[selectedType].forEach(category => {
          const option = document.createElement('option');
          option.value = category;
          option.textContent = category;
          categorySelect.appendChild(option);
        });
      }
    });
  </script>
</body>
</html>
